packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"
  # The documentation site is deliberately OUTSIDE this workspace (`apps/docs/README.md`).
  #
  # It is a Mintlify site, which runs from its own standalone CLI (`npx mint dev`), so it has no
  # package.json and no pnpm dependencies to install. The exclusion is kept so that if a
  # package.json is ever added under apps/docs, its dev tooling cannot silently pull weak-copyleft
  # or unusual-licence packages into the tree that `scripts/license-gate.mjs` enforces fail-closed
  # over — the licence gate must keep measuring exactly the service we operate.
  - "!apps/docs"
  # The explorer frontend (Vite + React) is likewise OUTSIDE the workspace with its own lockfile:
  # UI build tooling must not enter the tree the license gate enforces fail-closed over.
  - "!apps/explorer/frontend"

# Keep a single resolved version of the x402 SDK family and the Stellar SDK across
# the whole workspace. Divergence here would let two packages disagree about wire
# types, which is exactly the failure mode conformance is supposed to catch.
catalog:
  "@x402/core": "2.20.0"
  "@x402/stellar": "2.20.0"
  "@x402/extensions": "2.20.0"
  "@x402/mcp": "2.20.0"
  "@stellar/stellar-sdk": "^16.2.0"
