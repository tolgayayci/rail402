name: contract-release

# A tag upto-contract-v<crate version>[-<n>] (upto-contract-v1.0.0, …) releases the upto settlement contract
# through stellar.expert's reusable build workflow (stellar-expert/soroban-build-workflow, SEP-55):
# it builds contracts/stellar/upto with `stellar contract build --optimize` and the metadata
# `source_repo=github:<this repository>`, publishes the wasm as a GitHub release, attests it with
# build provenance and sends stellar.expert the validation request. stellar.expert accepts that
# request only from its own workflow, so the build itself is not done here.
#
# Before the release, `check` rebuilds the contract with scripts/contracts/build.sh, which reproduces
# the workflow's bytes, and requires them to be the committed wasm that every deployment record
# (contracts/stellar/deployments/*.json: testnet, and pubnet once deployed) names. Afterwards,
# `confirm` requires the released wasm to be that same wasm and its attestation to come from
# stellar.expert's workflow in this repository, and reports stellar.expert's validation of each
# deployed contract on its network.

on:
  push:
    tags: ["upto-contract-v*"]

permissions:
  contents: read

env:
  # The reviewed revision of stellar.expert's release workflow. It runs actions/checkout@v6,
  # stellar/stellar-cli@v28.1.0, actions/setup-node@v4 and actions/attest-build-provenance@v1 by tag.
  REVIEWED: 6b16426dd3a61715ddddf83a2df322a6371fe071

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A person approves every release before stellar.expert's workflow runs with this repository's token:
    # the contract-release environment requires a reviewer.
    environment: contract-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The release workflow is the reviewed revision
        # stellar.expert accepts builds only from its workflow's main branch, so the call below cannot
        # be pinned to a commit; this refuses a release when main has moved since it was reviewed. It
        # reads a mutable name, so `confirm` also checks the revision that actually ran.
        run: |
          main="$(git ls-remote https://github.com/stellar-expert/soroban-build-workflow.git refs/heads/main | cut -f1)"
          if [ "$main" != "$REVIEWED" ]; then
            echo "::error::stellar-expert/soroban-build-workflow main is $main, reviewed revision is $REVIEWED"
            exit 1
          fi
      - name: The tag names the crate version and the build names this repository
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' contracts/stellar/upto/Cargo.toml | head -1)"
          # upto-contract-v1.0.0, or upto-contract-v1.0.0-<n> to release the same version again.
          case "$GITHUB_REF_NAME" in
            "upto-contract-v$version" | "upto-contract-v$version-"*) ;;
            *)
              echo "::error::tag $GITHUB_REF_NAME does not name the crate version $version"
              exit 1
              ;;
          esac
          repo="$(sed -n 's/^SOURCE_REPO="\(.*\)"/\1/p' scripts/contracts/common.sh)"
          if [ "$repo" != "github:$GITHUB_REPOSITORY" ]; then
            echo "::error::scripts/contracts/common.sh builds for $repo, this is github:$GITHUB_REPOSITORY"
            exit 1
          fi
      - name: The pinned build reproduces the deployed wasm
        run: |
          scripts/contracts/build.sh --contract upto --check
          built="$(sha256sum target/contracts/upto/x402_upto_stellar.wasm | cut -d' ' -f1)"
          for record in contracts/stellar/deployments/*.json; do
            deployed="$(jq -er .wasm_sha256 "$record")"
            if [ "$built" != "$deployed" ]; then
              echo "::error::the build gives $built, $record runs $deployed"
              exit 1
            fi
          done

  release:
    needs: check
    permissions:
      id-token: write
      contents: write
      attestations: write
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: x402 upto settlement contract (contracts/stellar/upto), built by stellar.expert's release workflow.
      relative_path: contracts/stellar/upto
      package: x402-upto-stellar
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  confirm:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The released wasm is the deployed wasm, attested by stellar.expert's workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release workflow names its release <tag>_<path>_<package>_…_cli<version>.
          release="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' |
            grep -F "${GITHUB_REF_NAME}_" | head -1)"
          if [ -z "$release" ]; then
            echo "::error::no release for $GITHUB_REF_NAME"
            exit 1
          fi
          gh release download "$release" --repo "$GITHUB_REPOSITORY" --pattern '*.wasm' --dir release
          wasm="$(ls release/*.wasm)"
          released="$(sha256sum "$wasm" | cut -d' ' -f1)"
          echo "release $release: $wasm $released"
          for record in contracts/stellar/deployments/*.json; do
            deployed="$(jq -er .wasm_sha256 "$record")"
            if [ "$released" != "$deployed" ]; then
              echo "::error::the released wasm is $released, $record runs $deployed"
              exit 1
            fi
          done
          # The attestation names the workflow revision that ran and the commit it built: both must be
          # the reviewed revision and this tag's commit.
          gh attestation verify "$wasm" --repo "$GITHUB_REPOSITORY" \
            --signer-repo stellar-expert/soroban-build-workflow \
            --signer-digest "$REVIEWED" --source-digest "$GITHUB_SHA"
      - name: stellar.expert validation status
        run: |
          for record in contracts/stellar/deployments/*.json; do
            contract="$(jq -er .contract_id "$record")"
            case "$(jq -er .caip2 "$record")" in
              stellar:pubnet) explorer=public ;;
              stellar:testnet) explorer=testnet ;;
              *)
                echo "::error::$record names an unknown network"
                exit 1
                ;;
            esac
            validation="$(curl -fsS "https://api.stellar.expert/explorer/$explorer/contract/$contract" | jq -c .validation || true)"
            echo "stellar.expert validation of $contract ($explorer): ${validation:-unavailable}"
            case "$validation" in
              *'"verified"'*) ;;
              *) echo "::notice::stellar.expert has not validated $contract on $explorer yet; it validates after its queue picks up the request" ;;
            esac
          done
