# osv-scanner configuration for CI (`osv-scanner --config=osv-scanner.toml`). Every ignored advisory
# names why it does not apply and when it must be looked at again.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
ignoreUntil = 2027-04-30
reason = "paste is unmaintained, with no known vulnerability; soroban-sdk uses it as a build-time proc macro in the contract crates, and no maintained replacement is available through soroban-sdk yet."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
ignoreUntil = 2027-02-28
reason = "crypto-bigint 0.5 reaches the contract crates only through soroban-env-host, the local test and simulation host of soroban-sdk; it is not in any contract's WASM and handles no secrets there. A fixed release needs elliptic-curve 0.14, which soroban-sdk does not use yet."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0441"
ignoreUntil = 2027-04-30
reason = "pin-utils is unmaintained, with no known vulnerability; futures-util pulls it into the contract crates' lockfiles, and no fixed version exists"
