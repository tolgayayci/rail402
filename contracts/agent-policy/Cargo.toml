[package]
name = "x402-agent-policy"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "x402-aware spending policy for OpenZeppelin Soroban smart accounts"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "26"
stellar-accounts = "0.7.2"

[dev-dependencies]
soroban-sdk = { version = "26", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
