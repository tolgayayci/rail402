# Postgres settings for continuous archiving with pgBackRest (include from postgresql.conf, or pass each as
# -c on the command line). archive_timeout bounds the recovery point: a WAL segment is archived at least
# once a minute even when traffic is low.
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=rail402 archive-push %p'
archive_timeout = 60
max_wal_senders = 3
