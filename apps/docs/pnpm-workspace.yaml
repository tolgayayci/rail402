# This file makes `apps/docs` its own pnpm workspace root.
#
# Without it, `pnpm install` here walks up, finds the repository's workspace file, and installs
# nothing — because the root explicitly excludes this directory (`!apps/docs`).
#
# The exclusion is deliberate. The repository's licence gate is fail-closed over the
# deliverable's entire transitive tree, and a Next.js docs site adds ~440 packages that the
# facilitator, Bazaar, MCP server and shipped packages never touch — sharp/libvips (LGPL-3.0),
# lightningcss and axe-core (MPL-2.0), caniuse-lite (CC-BY-4.0). Keeping the site out preserves the
# graded gate at 306 packages with zero review items, rather than relaxing the standard that covers
# settlement code so a docs site can build.
#
# See `README.md` in this directory.
packages: []
