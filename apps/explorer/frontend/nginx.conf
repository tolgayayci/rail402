server {
  listen 8080;
  root /usr/share/nginx/html;
  # Hashed build assets are immutable; everything else falls back to the SPA entry.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location / {
    try_files $uri /index.html;
  }
}
