# Cloudflare Workers deployment for the x402 Stellar facilitator.
#
#   pnpm --filter @rail402/facilitator deploy:worker
#
# Verified 2026-08-06 against a real deployment: bundles to 2,685 KiB / 595 KiB gzipped and serves
# /health, /supported, /verify and /settle under workerd, including real Stellar keypair loading.
# (The earlier "~384 KiB" note predated the vendored search embeddings.)
#
# TESTNET ONLY. `STELLAR_NETWORKS` is pinned to stellar:testnet here and there is no pubnet
# configuration anywhere in this file.
#
# Read `src/worker.ts` before enabling discovery: the catalog is in-memory and Worker isolates are
# ephemeral, so listings do not survive between requests. The facilitator endpoints (/verify,
# /settle, /supported) are stateless and unaffected.

name = "rail402-facilitator"
main = "dist/worker.js"
compatibility_date = "2026-01-01"

# @stellar/stellar-sdk reaches for Node built-ins (crypto, buffer). Without this the bundle
# resolves but fails at runtime.
compatibility_flags = ["nodejs_compat"]

# Custom domain. `custom_domain = true` makes Cloudflare create and manage the DNS record and the
# certificate for this hostname, so there is no separate DNS step and no orange-cloud proxy in front.
routes = [
  { pattern = "facilitator.rail402.dev", custom_domain = true }
]

# Catalog durability. Cloudflare gives no durable disk to a Worker or a Container ("all disk is
# ephemeral"), so the catalog lives in D1 behind the same `CatalogPersistence` seam the Node
# deployment fills with SQLite.
[[d1_databases]]
binding = "CATALOG_DB"
database_name = "rail402-catalog"
database_id = "7a83ba3e-3aee-4e16-b68c-bb84c2c5a667"

[observability]
enabled = true

[vars]
STELLAR_NETWORKS = "stellar:testnet"
LOG_LEVEL = "info"
# This Worker does NOT serve /discovery/* — the catalog is in-memory and isolates are ephemeral, and
# neither node:sqlite nor the 7.5 MB embedding blob works under workerd. So it must not advertise the
# `bazaar` extension either: a facilitator that claims an extension it 404s is the exact
# advertised-versus-reachable failure this project measures in other facilitators. The Bazaar runs on
# a stateful host and advertises `bazaar` there.
# Discovery IS served here now: the catalog lives in D1, not on an isolate's memory or disk, so a
# listing survives isolate replacement. That is what makes advertising `bazaar` truthful.
SERVES_DISCOVERY = "1"
# A `__check_auth` smart-account payment cross-calls a signature verifier and a spending policy, so
# it costs ~210k stroops for `exact` and ~180k for `upto` against ~23k for a plain keypair. The
# 100,000 default REFUSES them, correctly and with a legible reason — so any deployment serving
# smart-account buyers must raise it. Measured on-ledger, not guessed.
MAX_TRANSACTION_FEE_STROOPS = "500000"
# Rate limiting here is per-isolate and therefore close to meaningless — Cloudflare may run many
# isolates concurrently. Use Cloudflare's own rate limiting rules in front of the Worker instead.
RATE_LIMIT_ENABLED = "false"

# Discovery is refused unless this is set to "1", so a lossy catalog is a decision rather than a
# surprise. See src/worker.ts.
# BAZAAR_EPHEMERAL_ACK = "1"

# Secrets are NEVER committed. Set them out of band:
#   wrangler secret put FACILITATOR_STELLAR_SECRET
#   wrangler secret put FACILITATOR_API_KEYS        # optional; enables /ops/signals
