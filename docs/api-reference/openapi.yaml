openapi: 3.1.0
info:
  title: Rail402
  version: 0.0.0
  summary: x402 facilitator and Bazaar discovery layer for Stellar.
  description: |
    The Rail402 HTTP service. `/supported`, `/verify` and `/settle` follow the x402 version 2 facilitator
    interface; `/discovery/*` serves the Bazaar catalog and search.

    Every endpoint except `/health`, `/ready` and `/metrics` is rate-limited per client address. A limited
    request gets HTTP 429 with a `Retry-After` header and the code `rate_limited`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://testnet.rail402.dev
    description: Hosted testnet facilitator (stellar:testnet only, no API key)
tags:
  - name: Facilitator
    description: x402 facilitator interface.
  - name: Discovery
    description: Bazaar catalog and natural-language search.
  - name: Operations
    description: Health, readiness, metrics and usage.
paths:
  /supported:
    get:
      tags: [Facilitator]
      operationId: getSupported
      summary: List supported payment kinds
      description: |
        The payment kinds this instance serves, the extensions it supports and the addresses of its fee
        sponsor, channel accounts and, on networks that serve `upto`, its `upto` settlement authority. An
        `upto` kind names that authority in `extra.facilitatorAddress`: `upto` payers sign terms naming it,
        and only it can settle them. A payment in which any listed signer is the payer, a transaction or
        operation source, or a party to an authorization is refused.
      responses:
        "200":
          description: Supported kinds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportedResponse"
              example:
                kinds:
                  - x402Version: 2
                    scheme: exact
                    network: stellar:testnet
                    extra:
                      areFeesSponsored: true
                  - x402Version: 2
                    scheme: upto
                    network: stellar:testnet
                    extra:
                      areFeesSponsored: true
                      facilitatorAddress: GCO2IP3MJNUOKS4PUDI4C7LGGMQDJGXG3COYX3WSB4HHNAHKYV5YL3VC
                extensions: [bazaar]
                signers:
                  stellar:*:
                    - GAX6MVOC5O5VZCSCCY26RM33AKPODAEHAMUS76IT4DBAGED46VIOWEPC
                    - GDZREJ6UXJDL7IMLRMHP4F6RM37TF3WUGRB7GPE5G4IUIXKS6ISZPVEQ
                    - GCO2IP3MJNUOKS4PUDI4C7LGGMQDJGXG3COYX3WSB4HHNAHKYV5YL3VC
        "429":
          $ref: "#/components/responses/RateLimited"
  /verify:
    post:
      tags: [Facilitator]
      operationId: verifyPayment
      summary: Verify a payment
      description: |
        Checks a payment against its requirements without settling it. Rejections are HTTP 200 with
        `isValid: false`, a stable `invalidReason` code and a non-empty `invalidMessage`.

        When the payment carries a valid `bazaar` extension, the `EXTENSION-RESPONSES` header previews the
        cataloging outcome.
      security:
        - {}
        - bearerKey: []
        - headerKey: []
      requestBody:
        $ref: "#/components/requestBodies/FacilitatorRequest"
      responses:
        "200":
          description: The verification outcome.
          headers:
            EXTENSION-RESPONSES:
              $ref: "#/components/headers/ExtensionResponses"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
              examples:
                valid:
                  summary: The payer of the recorded canonical client run
                  value:
                    isValid: true
                    payer: GDQMM2IJX6XCBTEW7J242PBXG3HQCKIF2N6WDYIQPG6UXPPY3N4VHC75
                invalidNetwork:
                  value:
                    isValid: false
                    invalidReason: invalid_network
                    invalidMessage: This facilitator does not serve the requested network.
        "400":
          description: The body is not JSON or lacks a required field (`invalid_payload`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyTransportError"
              example:
                isValid: false
                invalidReason: invalid_payload
                invalidMessage: "Malformed request: x402Version: Invalid input: expected number, received undefined."
                error:
                  code: bad_request
                  reason: "Malformed request: x402Version: Invalid input: expected number, received undefined."
                  retryable: false
        "401":
          description: The network requires an API key and none, or an unknown one, was sent (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyTransportError"
        "413":
          description: The body exceeds `BODY_LIMIT_BYTES` (`payload_too_large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyTransportError"
        "415":
          description: "The request is not `Content-Type: application/json` (`unsupported_media_type`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyTransportError"
        "429":
          description: Rate limited (`rate_limited`).
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyTransportError"
        "500":
          description: An unexpected error (`unexpected_verify_error`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
  /settle:
    post:
      tags: [Facilitator]
      operationId: settlePayment
      summary: Settle a payment
      description: |
        Verifies the payment again and settles it on-chain: a channel account is the transaction source and
        the fee sponsor pays the fee through a fee bump. Settlement is idempotent per authorization: a repeated
        request returns the recorded result, marked in `EXTENSION-RESPONSES`, and moves funds once. A different
        request for the same authorization (another envelope, `payTo`, asset or amount) is refused with
        `settle_exact_stellar_idempotency_conflict` (`settle_upto_stellar_idempotency_conflict` for `upto`).
        For `upto`, `paymentRequirements.amount` is the amount to settle, from zero up to the cap the payer
        accepted, and the response carries it in `amount`.

        Rejections are HTTP 200 with `success: false`, a stable `errorReason` code and a non-empty
        `errorMessage`. `settlement_pending` carries the transaction hash; the settlement is finished in the
        background.

        When the settled payment carries a `bazaar` extension, the `EXTENSION-RESPONSES` header reports the
        cataloging outcome.
      security:
        - {}
        - bearerKey: []
        - headerKey: []
      requestBody:
        $ref: "#/components/requestBodies/FacilitatorRequest"
      responses:
        "200":
          description: The settlement outcome.
          headers:
            EXTENSION-RESPONSES:
              $ref: "#/components/headers/ExtensionResponses"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettleResponse"
              examples:
                settled:
                  summary: The settlement of the recorded canonical client run
                  value:
                    success: true
                    transaction: 9cd39ec85e02bf9d009d3d790801fa860557a3120b06d7b721d2ba55d7631fe5
                    network: stellar:testnet
                    payer: GDQMM2IJX6XCBTEW7J242PBXG3HQCKIF2N6WDYIQPG6UXPPY3N4VHC75
                refused:
                  value:
                    success: false
                    errorReason: invalid_exact_stellar_payload_accepted_mismatch
                    errorMessage: The payload's accepted requirements differ from the payment requirements.
                    transaction: ""
                    network: stellar:testnet
        "400":
          description: The body is not JSON or lacks a required field (`invalid_payload`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettleTransportError"
        "401":
          description: The network requires an API key and none, or an unknown one, was sent (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettleTransportError"
        "413":
          description: The body exceeds `BODY_LIMIT_BYTES` (`payload_too_large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettleTransportError"
        "415":
          description: "The request is not `Content-Type: application/json` (`unsupported_media_type`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettleTransportError"
              example:
                success: false
                errorReason: unsupported_media_type
                errorMessage: "The request body must be JSON (Content-Type: application/json)."
                transaction: ""
                network: ""
                error:
                  code: unsupported_media_type
                  reason: "The request body must be JSON (Content-Type: application/json)."
                  retryable: false
        "429":
          description: Rate limited (`rate_limited`).
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettleTransportError"
        "500":
          description: An unexpected error (`unexpected_settle_error`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettleResponse"
  /discovery/resources:
    get:
      tags: [Discovery]
      operationId: listResources
      summary: List cataloged resources
      description: |
        Published resources in catalog order (first published first), so offset paging pinned with
        `asOf` is stable. A resource sold on several networks is one item. `payTo`, `scheme` and `network`
        must hold for one and the same payment option, and a filtered item shows only the options that
        matched. Unsupported or malformed parameters are refused.
      parameters:
        - $ref: "#/components/parameters/Type"
        - $ref: "#/components/parameters/PayTo"
        - $ref: "#/components/parameters/Scheme"
        - $ref: "#/components/parameters/Network"
        - $ref: "#/components/parameters/Extensions"
        - name: limit
          in: query
          description: Page size, in resources. Values above 100 are clamped to 100.
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: offset
          in: query
          description: Resources to skip.
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
        - name: asOf
          in: query
          description: Only listings first published at or before this time. Pass back `pagination.asOf`.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: A page of resources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryList"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "429":
          $ref: "#/components/responses/RateLimited"
  /discovery/resources/{id}:
    get:
      tags: [Discovery]
      operationId: getResource
      summary: Get a listing
      description: One listing, on its one network, by id, published or quarantined, with its `state`.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: The listing.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DiscoveryItem"
                  - type: object
                    required: [state]
                    properties:
                      state:
                        type: string
                        enum: [pending, published, quarantined]
        "404":
          $ref: "#/components/responses/ListingNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /discovery/resources/{id}/versions:
    get:
      tags: [Discovery]
      operationId: getResourceVersions
      summary: Get a listing's version history
      description: Every version of the listing, oldest first, each a full snapshot of what was published.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: The version history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionList"
        "404":
          $ref: "#/components/responses/ListingNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /discovery/search:
    get:
      tags: [Discovery]
      operationId: searchResources
      summary: Search the catalog
      description: |
        Natural-language search over published listings. Hard filters, from parameters or recognised in
        the query text, apply before ranking; lexical (BM25F) and semantic (local embeddings) rankings are
        fused with reciprocal rank fusion. Explicit parameters override the same constraint in the text.
      parameters:
        - name: query
          in: query
          required: true
          description: |
            What to find, in natural language. 1 to 500 characters after trimming. Longer than 500 after
            trimming is `search_query_too_long`; longer than 2,000 is `discovery_invalid_parameter`.
          schema:
            type: string
            maxLength: 2000
          example: current weather for a city on testnet under 2 cents
        - $ref: "#/components/parameters/Type"
        - $ref: "#/components/parameters/PayTo"
        - $ref: "#/components/parameters/Scheme"
        - $ref: "#/components/parameters/Network"
        - $ref: "#/components/parameters/Extensions"
        - name: asset
          in: query
          description: Only payment options in this asset, by `C…` contract address or symbol.
          schema:
            type: string
            pattern: "^C[A-Z2-7]{55}$|^[A-Za-z0-9]{1,12}$"
        - name: maxPrice
          in: query
          description: Price ceiling, in the asset's units if `asset` is set, else in US dollars.
          schema:
            type: string
            pattern: "^\\d{1,15}(\\.\\d{1,18})?$"
        - name: limit
          in: query
          description: Page size, in resources. Values above 50 are clamped to 50.
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: cursor
          in: query
          description: The `pagination.cursor` of the previous page.
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: A page of results, best first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          description: |
            `discovery_invalid_parameter` (missing `query`, malformed or unsupported parameter),
            `search_query_required`, `search_query_too_long`, `search_invalid_cursor` or
            `search_cursor_expired`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error:
                  code: search_query_required
                  reason: The `query` parameter is required and must not be blank.
                  retryable: false
        "429":
          $ref: "#/components/responses/RateLimited"
  /health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Liveness and operational snapshot
      description: |
        Answers 200 whenever the process is up, whatever its state; the Docker `HEALTHCHECK` uses it. The
        body is the snapshot the background poll rebuilds every 15 seconds, so answering never waits on the
        network or the database. `state` is `degraded` while any warning is `critical`. Never rate-limited.
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                version: 0.4.1
                state: healthy
                checkedAt: "2026-09-30T12:00:00.000Z"
                warnings: []
                networks:
                  stellar:testnet:
                    rpc: { ok: true, latestLedger: 4941750, ledgerAgeSeconds: 3, transportErrors1h: 0 }
                    sponsor:
                      address: GBHEGW3KWOY2OFH767EDALFGCUTBOEVBDQMCKU4APMDLQNBW5QV3W3KO
                      balanceStroops: "99875000000"
                      committed1hStroops: "1200000"
                      wasted1hStroops: "0"
                    channels: { total: 8, inUse: 0, leaseWaitP95Ms: 4.8, leaseTimeouts1h: 0 }
                    settlements:
                      last1h: { succeeded: 12, failed: 0, expired: 0, pending: 0 }
                      unfinished: 0
                      unresolvable: 0
                      repeats1h: 1
                    sequenceConflicts1h: 0
                    contracts:
                      USDC:
                        id: CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA
                        instanceTtlLedgers: 2245736
                catalog:
                  listings: { pending: 0, published: 14, quarantined: 1 }
                  outboxPending: 0
                  outcomes1h: { settle: { success: 3 }, origin_check: { success: 3 } }
                search:
                  indexRevision: 42
                  indexAgeSeconds: 4
                  lastBuild: ok
                  embeddingFailures1h: 0
                  p50Ms: 3.1
                  p95Ms: 9.4
  /ready:
    get:
      tags: [Operations]
      operationId: getReady
      summary: Readiness
      description: |
        Ready when the database is reachable, and for every network the RPC is healthy, the sponsor holds at
        least `MIN_SPONSOR_BALANCE_XLM`, every accepted asset is deployed with its configured decimals and
        every channel account exists, and the first search index is built. Never rate-limited.
      responses:
        "200":
          description: Every check passes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                ready: true
                checks:
                  database:
                    ok: true
                  stellar:testnet:rpc:
                    ok: true
                  stellar:testnet:sponsor:
                    ok: true
                    detail: 99999974478 stroops
                  stellar:testnet:assets:
                    ok: true
                    detail: USDC:7
                  stellar:testnet:channels:
                    ok: true
                    detail: 24 channels
                  search:
                    ok: true
        "503":
          description: At least one check fails.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /metrics:
    get:
      tags: [Operations]
      operationId: getMetrics
      summary: Prometheus metrics
      description: |
        Metrics in the Prometheus text format. Never rate-limited. Public unless `METRICS_TOKEN_SHA256` is
        set; then the matching bearer token is required.
      security:
        - {}
        - metricsToken: []
      responses:
        "200":
          description: The metrics.
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: "`METRICS_TOKEN_SHA256` is set and the request carries no matching bearer token (`unauthorized`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /usage:
    get:
      tags: [Operations]
      operationId: getUsage
      summary: Usage of the calling API key
      description: |
        The last 31 days of metered `/verify` and `/settle` calls for the API key that makes the request, and
        the service fee accrued for its successful settlements.
      security:
        - bearerKey: []
        - headerKey: []
      responses:
        "200":
          description: Usage rows. With the Postgres store they are ordered newest day first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "401":
          description: No known API key was sent (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error:
                  code: unauthorized
                  reason: A valid API key is required for this endpoint.
                  retryable: false
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    metricsToken:
      type: http
      scheme: bearer
      description: A token whose SHA-256 digest is `METRICS_TOKEN_SHA256`.
    bearerKey:
      type: http
      scheme: bearer
      description: An API key whose SHA-256 digest is listed in `API_KEY_SHA256`.
    headerKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: An API key whose SHA-256 digest is listed in `API_KEY_SHA256`.
  headers:
    ExtensionResponses:
      description: |
        Base64-encoded JSON keyed by extension name. `bazaar` is present when the payment carries a `bazaar`
        extension (`CatalogOutcome`). On `/settle`, `rail402` is present when the response was answered from
        an earlier settlement of the same payment: `{"rail402": {"settlement": {"repeat": true, "settledBy":
        "rail402"}}}`.
      schema:
        type: string
    RetryAfter:
      description: Seconds until a retry can succeed.
      schema:
        type: integer
  parameters:
    Type:
      name: type
      in: query
      description: Only listings of this resource type. Unknown types match nothing.
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_-]{0,31}$"
        examples: [http, mcp]
    PayTo:
      name: payTo
      in: query
      description: Only payment options paying this address (a `G…` address also matches muxed addresses on it).
      schema:
        type: string
        pattern: "^[A-Z2-7]{56}$|^M[A-Z2-7]{68}$"
    Scheme:
      name: scheme
      in: query
      description: Only payment options in this scheme.
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_-]{0,31}$"
        examples: [exact]
    Network:
      name: network
      in: query
      description: Only payment options on this CAIP-2 network.
      schema:
        type: string
        pattern: "^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,64}$"
        examples: [stellar:testnet]
    Extensions:
      name: extensions
      in: query
      description: Comma-separated extension keys (at most 10) every resource must declare in its 402 response.
      schema:
        type: string
        pattern: "^[a-zA-Z0-9_-]{1,64}(,[a-zA-Z0-9_-]{1,64}){0,9}$"
        examples: [bazaar]
    ListingId:
      name: id
      in: path
      required: true
      description: A listing's id (`rail402.listings[].id`).
      schema:
        type: string
        format: uuid
  requestBodies:
    FacilitatorRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FacilitatorRequest"
  responses:
    RateLimited:
      description: Rate limited (`rate_limited`).
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    InvalidParameter:
      description: A parameter is malformed or not supported (`discovery_invalid_parameter`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error:
              code: discovery_invalid_parameter
              reason: "Unsupported parameter: foo."
              retryable: false
    ListingNotFound:
      description: No listing has this id (`discovery_listing_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error:
              code: discovery_listing_not_found
              reason: No listing has this identifier.
              retryable: false
  schemas:
    PaymentRequirements:
      type: object
      description: An x402 version 2 payment option.
      required: [scheme, network]
      properties:
        scheme:
          type: string
          examples: [exact]
        network:
          type: string
          examples: [stellar:testnet]
        asset:
          type: string
          description: The SEP-41 token's contract address (`C…`).
        payTo:
          type: string
          description: The recipient, a `G…`, `C…` or `M…` address (`upto`, `G…` or `C…` only).
        amount:
          type: string
          description: |
            The amount in the asset's base units. For `upto`: the cap in the accepted block and at `/verify`,
            the amount to settle at `/settle`.
        maxTimeoutSeconds:
          type: integer
        extra:
          type: object
          additionalProperties: true
          properties:
            areFeesSponsored:
              type: boolean
            facilitatorAddress:
              type: string
              description: "`upto`: the settlement authority from `/supported`, named in the terms the payer signs."
      additionalProperties: true
    PaymentPayload:
      type: object
      description: |
        An x402 version 2 payment payload. For `exact` on Stellar, `payload` is `{ transaction }`; for `upto`,
        `{ authorization, signerAuthorizations? }` (see the upto payments page).
      required: [x402Version, accepted, payload]
      properties:
        x402Version:
          type: integer
          const: 2
        accepted:
          $ref: "#/components/schemas/PaymentRequirements"
        payload:
          type: object
          properties:
            transaction:
              type: string
              description: "`exact`: a base64 transaction envelope with the payer's signed authorization entry."
            authorization:
              type: string
              description: "`upto`: the payer's signed `SorobanAuthorizationEntry` for `settle(terms)`, base64 XDR, at most 8 KiB."
            signerAuthorizations:
              type: array
              maxItems: 4
              description: "`upto`, smart-account payers only: signed entries of other signers the account's `__check_auth` requires."
              items:
                type: string
          additionalProperties: true
        resource:
          type: object
          description: The paid resource; read for cataloging.
          additionalProperties: true
        extensions:
          type: object
          description: Extensions echoed from the seller's 402, such as `bazaar`.
          additionalProperties: true
      additionalProperties: true
    FacilitatorRequest:
      type: object
      required: [x402Version, paymentPayload, paymentRequirements]
      properties:
        x402Version:
          type: integer
          examples: [2]
        paymentPayload:
          $ref: "#/components/schemas/PaymentPayload"
        paymentRequirements:
          $ref: "#/components/schemas/PaymentRequirements"
    VerifyResponse:
      type: object
      required: [isValid]
      properties:
        isValid:
          type: boolean
        invalidReason:
          type: string
          description: A stable code; present when `isValid` is false.
        invalidMessage:
          type: string
          description: A non-empty human-readable reason; present when `isValid` is false.
        payer:
          type: string
    SettleResponse:
      type: object
      required: [success, transaction, network]
      properties:
        success:
          type: boolean
        errorReason:
          type: string
          description: A stable code; present when `success` is false.
        errorMessage:
          type: string
          description: A non-empty human-readable reason; present when `success` is false.
        payer:
          type: string
        transaction:
          type: string
          description: The settlement transaction hash; empty when nothing was broadcast.
        network:
          type: string
        amount:
          type: string
          description: '`upto`: the amount settled in base units, `"0"` included; always present for `upto`.'
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, reason, retryable]
          properties:
            code:
              type: string
            reason:
              type: string
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
    VerifyTransportError:
      description: A transport-level rejection of `/verify`, in the x402 shape plus the `error` object.
      allOf:
        - $ref: "#/components/schemas/VerifyResponse"
        - $ref: "#/components/schemas/ErrorBody"
    SettleTransportError:
      description: A transport-level rejection of `/settle`, in the x402 shape plus the `error` object.
      allOf:
        - $ref: "#/components/schemas/SettleResponse"
        - $ref: "#/components/schemas/ErrorBody"
    SupportedResponse:
      type: object
      required: [kinds, extensions, signers]
      properties:
        kinds:
          type: array
          items:
            type: object
            required: [x402Version, scheme, network]
            properties:
              x402Version:
                type: integer
              scheme:
                type: string
              network:
                type: string
              extra:
                type: object
                additionalProperties: true
        extensions:
          type: array
          items:
            type: string
        signers:
          type: object
          description: Facilitator addresses by CAIP family (`stellar:*`), sponsor first, then channel accounts, then the `upto` settlement authority where `upto` is served.
          additionalProperties:
            type: array
            items:
              type: string
    CatalogOutcome:
      type: object
      description: The `bazaar` entry of the `EXTENSION-RESPONSES` header.
      required: [status, code]
      properties:
        status:
          type: string
          enum: [success, processing, rejected]
        code:
          type: string
          examples:
            [
              cataloged,
              recorded,
              awaiting_settlement,
              cataloging_in_progress,
              awaiting_origin_verification,
              bazaar_resource_unsafe,
            ]
        rejectedReason:
          type: string
        reason:
          type: string
        listingId:
          type: string
          format: uuid
        version:
          type: integer
        dropped:
          type: array
          items:
            type: string
    Health:
      type: object
      required: [status, version, state, checkedAt, warnings, networks]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          description: The `RAIL402_VERSION` the image was built with, `dev` by default.
        state:
          type: string
          enum: [starting, healthy, degraded]
          description: "`starting` until the first poll finished; `degraded` while any warning is `critical`."
        checkedAt:
          type: [string, "null"]
          format: date-time
        warnings:
          type: array
          items:
            type: object
            required: [code, severity, message]
            properties:
              code:
                type: string
                enum:
                  - rpc_unhealthy
                  - ledger_stale
                  - sponsor_below_floor
                  - settlement_ledger_unreadable
                  - settlements_unresolvable
                  - contract_missing
                  - contract_archived
                  - contract_ttl_critical
                  - contract_ttl_low
                  - contract_ttl_unchecked
                  - catalog_unreadable
                  - search_index_failed
                  - search_index_degraded
                  - upto_authority_missing
                  - upto_authority_funded
                  - upto_authority_holds_tokens
                  - upto_contract_restore_required
                  - upto_ttl_keeper_failed
              severity:
                type: string
                enum: [critical, warning]
              message:
                type: string
                minLength: 1
              network:
                type: string
              contract:
                type: string
                description: The watched contract's alias.
        networks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/NetworkHealth"
        catalog:
          type: object
          description: Present when the Bazaar is enabled.
          required: [listings, outboxPending, outcomes1h]
          properties:
            listings:
              type: [object, "null"]
              properties:
                pending: { type: integer }
                published: { type: integer }
                quarantined: { type: integer }
            outboxPending:
              type: [integer, "null"]
            outcomes1h:
              type: object
              description: Cataloging outcomes in the last hour, by phase, then by status.
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        search:
          type: object
          description: Present when the Bazaar is enabled.
          required: [indexRevision, indexAgeSeconds, lastBuild, embeddingFailures1h, p50Ms, p95Ms]
          properties:
            indexRevision: { type: [integer, "null"] }
            indexAgeSeconds: { type: [integer, "null"] }
            lastBuild:
              type: [string, "null"]
              enum: [ok, degraded, failed, null]
            embeddingFailures1h: { type: integer }
            p50Ms: { type: [number, "null"] }
            p95Ms: { type: [number, "null"] }
    NetworkHealth:
      type: object
      required: [rpc, sponsor, channels, settlements, sequenceConflicts1h, contracts]
      properties:
        rpc:
          type: object
          required: [ok, latestLedger, ledgerAgeSeconds, transportErrors1h]
          properties:
            ok: { type: boolean }
            latestLedger: { type: [integer, "null"] }
            ledgerAgeSeconds: { type: [integer, "null"] }
            transportErrors1h: { type: integer }
        sponsor:
          type: object
          required: [address, balanceStroops, committed1hStroops, wasted1hStroops]
          properties:
            address: { type: string }
            balanceStroops: { type: [string, "null"] }
            committed1hStroops: { type: [string, "null"] }
            wasted1hStroops: { type: string }
        channels:
          type: object
          required: [total, inUse, leaseWaitP95Ms, leaseTimeouts1h]
          properties:
            total: { type: integer }
            inUse: { type: [integer, "null"] }
            leaseWaitP95Ms: { type: [number, "null"] }
            leaseTimeouts1h: { type: integer }
        settlements:
          type: object
          required: [last1h, unfinished, unresolvable, repeats1h]
          properties:
            last1h:
              type: [object, "null"]
              description: Settlements claimed in the last hour, by their current state.
              properties:
                succeeded: { type: integer }
                failed: { type: integer }
                expired: { type: integer }
                pending: { type: integer }
            unfinished: { type: [integer, "null"] }
            unresolvable: { type: integer }
            repeats1h: { type: integer }
        sequenceConflicts1h:
          type: integer
        contracts:
          type: object
          description: Watched contracts by alias; TTLs in ledgers, negative once archived, null when missing.
          additionalProperties:
            type: object
            required: [id, instanceTtlLedgers]
            properties:
              id: { type: string }
              instanceTtlLedgers: { type: [integer, "null"] }
              codeTtlLedgers: { type: integer }
        upto:
          type: object
          description: Present on networks that serve `upto`. Its problems degrade `/health` but never fail `/ready`.
          required: [contract, authority, keeper]
          properties:
            contract: { type: string }
            authority:
              type: object
              description: The settlement authority; it should exist and hold nothing it can spend.
              required: [address, present, balanceStroops, spendableStroops, tokens]
              properties:
                address: { type: string }
                present: { type: [boolean, "null"] }
                balanceStroops: { type: [string, "null"] }
                spendableStroops:
                  type: [string, "null"]
                  description: XLM beyond the account's locked minimum balance.
                tokens:
                  type: [array, "null"]
                  description: Accepted tokens the authority holds a positive balance of.
                  items:
                    type: object
                    required: [symbol, contract, balance]
                    properties:
                      symbol: { type: string }
                      contract: { type: string }
                      balance: { type: string }
            keeper:
              type: object
              required: [enabled, autoRestore, checkedAt, plan, lastAction, error]
              properties:
                enabled: { type: boolean }
                autoRestore: { type: boolean }
                checkedAt: { type: [string, "null"], format: date-time }
                plan: { type: [string, "null"] }
                lastAction:
                  type: [object, "null"]
                  properties:
                    action: { type: string }
                    transaction: { type: string }
                    at: { type: string, format: date-time }
                error: { type: [string, "null"] }
    Readiness:
      type: object
      required: [ready, checks]
      properties:
        ready:
          type: boolean
        checks:
          type: object
          additionalProperties:
            type: object
            required: [ok]
            properties:
              ok:
                type: boolean
              detail:
                type: string
    DiscoveryItem:
      type: object
      required: [resource, type, x402Version, accepts, lastUpdated, extensions, rail402]
      properties:
        resource:
          type: string
        type:
          type: string
          enum: [http, mcp]
        x402Version:
          type: integer
          const: 2
        accepts:
          type: array
          items:
            $ref: "#/components/schemas/PaymentRequirements"
        lastUpdated:
          type: string
          format: date-time
        description:
          type: string
        mimeType:
          type: string
        serviceName:
          type: string
        tags:
          type: array
          items:
            type: string
        iconUrl:
          type: string
        extensions:
          type: object
          required: [bazaar]
          description: >-
            `bazaar`, and an empty object for every other extension the resource declares in its 402
            response.
          properties:
            bazaar:
              type: object
              description: The validated `info`, `schema` and, if accepted, `routeTemplate`.
              additionalProperties: true
          additionalProperties:
            type: object
            maxProperties: 0
        rail402:
          type: object
          description: >-
            The catalog listings behind the resource. A resource sold on several networks is one item with
            one listing per network.
          required: [trust, settlements, listings, options]
          properties:
            method:
              type: string
            toolName:
              type: string
            trust:
              type: string
              enum: [settled, origin_verified, domain_verified]
              description: The strongest trust among the resource's listings.
            settlements:
              type: integer
              description: Settlements across the resource's listings.
            listings:
              type: array
              minItems: 1
              items:
                type: object
                required: [id, network, version, trust, owner, settlements, firstCataloged, lastSettled]
                properties:
                  id:
                    type: string
                    format: uuid
                  network:
                    type: string
                  version:
                    type: integer
                  trust:
                    type: string
                    enum: [settled, origin_verified, domain_verified]
                  owner:
                    type: string
                  settlements:
                    type: integer
                  firstCataloged:
                    type: string
                    format: date-time
                  lastSettled:
                    type: string
                    format: date-time
                  stellar:
                    type: object
                    description: When the listing's Stellar facts were read; absent until first checked.
                    required: [checkedAt]
                    properties:
                      checkedAt:
                        type: string
                        format: date-time
                      domain:
                        type: object
                        description: >-
                          The SEP-1 binding of the resource host and the owner. Trust is `domain_verified` only
                          while both fields are true and the listing's content was confirmed by its origin.
                        required: [host, claimsOwner, homeDomainMatches]
                        properties:
                          host:
                            type: string
                          claimsOwner:
                            type: boolean
                            description: Whether the host's SEP-1 stellar.toml lists the owner in ACCOUNTS.
                          homeDomainMatches:
                            type: boolean
                            description: Whether the owner's account sets the host as its home_domain.
            options:
              type: array
              description: One entry per `accepts` option, in the same order.
              items:
                type: object
                required: [listing]
                properties:
                  listing:
                    type: string
                    format: uuid
                    description: The listing the option belongs to.
                  symbol:
                    type: string
                  name:
                    type: string
                  decimals:
                    type: integer
                  receivable:
                    type: boolean
                    description: Whether payTo can receive the token now.
    DiscoveryList:
      type: object
      required: [x402Version, items, pagination]
      properties:
        x402Version:
          type: integer
          const: 2
        items:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveryItem"
        pagination:
          type: object
          required: [limit, offset, total, asOf]
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
            asOf:
              type: string
              format: date-time
              description: The time this page was read at; pass it back as `asOf` to pin a pagination.
    VersionList:
      type: object
      required: [x402Version, id, versions]
      properties:
        x402Version:
          type: integer
          const: 2
        id:
          type: string
          format: uuid
        versions:
          type: array
          items:
            type: object
            required: [version, createdAt, cause, owner, trust, state, content]
            properties:
              version:
                type: integer
              createdAt:
                type: string
                format: date-time
              cause:
                type: string
                enum: [settlement, origin_verification, ownership_transfer, domain_verification, quarantine]
              transaction:
                type: string
                description: The settlement that caused this version, when there was one.
              owner:
                type: string
              trust:
                type: string
                enum: [settled, origin_verified, domain_verified]
              state:
                type: string
                enum: [pending, published, quarantined]
              reason:
                type: string
                description: On a `quarantine` version made by an origin check, why the listing was withdrawn.
                enum:
                  [
                    origin_unreachable,
                    origin_not_payment_required,
                    origin_tool_not_listed,
                    origin_owner_mismatch,
                    origin_metadata_mismatch,
                    origin_payment_mismatch,
                  ]
              content:
                type: object
                description: The published content, with the catalog's field names (`kind`, `method` or `toolName`, `bazaar`, `accepts`).
                additionalProperties: true
    SearchResponse:
      type: object
      required: [x402Version, resources, partialResults, pagination, rail402]
      properties:
        x402Version:
          type: integer
          const: 2
        resources:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveryItem"
        partialResults:
          type: boolean
          description: >-
            True when the semantic ranking was cut at its depth, or a ranked (not filter-only) search ran
            lexical-only because no model is loaded or embedding the query failed or took over 2 seconds.
        pagination:
          type: object
          required: [limit, cursor]
          properties:
            limit:
              type: integer
            cursor:
              type: [string, "null"]
        rail402:
          type: object
          required: [method, recognised, revision]
          properties:
            method:
              type: string
              enum: [hybrid, lexical, filter]
            recognised:
              type: array
              items:
                type: string
              examples: [["network=stellar:testnet", "maxPrice=0.02 USD"]]
            revision:
              type: integer
    UsageResponse:
      type: object
      required: [subject, days, serviceFee, usage]
      properties:
        subject:
          type: string
          description: "`key:` followed by the first 16 hex characters of the key's SHA-256 digest."
        days:
          type: integer
          const: 31
        serviceFee:
          type: object
          required: [perSettlementUsd, accruedUsd]
          properties:
            perSettlementUsd:
              type: string
            accruedUsd:
              type: string
        usage:
          type: array
          items:
            type: object
            required: [day, network, operation, outcome, asset, requests, settledAmount]
            properties:
              day:
                type: string
                format: date
              network:
                type: string
              operation:
                type: string
                enum: [verify, settle]
              outcome:
                type: string
                enum: [valid, invalid, success, failure, pending]
              asset:
                type: string
              requests:
                type: integer
              settledAmount:
                type: string
                description: Settled volume in the asset's base units.
