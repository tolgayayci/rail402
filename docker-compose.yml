# Local development stack.
#
#   docker compose up -d postgres            database only (unit + most integration tests)
#   docker compose --profile stellar up -d   add a private Stellar network (1 s ledgers, Friendbot, RPC)
#   docker compose --profile service up -d   self-host: the Rail402 image against Postgres (configure .env)
#
# The private network is disposable: it resets whenever the container is recreated.
#
# It runs with the *testnet* passphrase. @x402/stellar only knows stellar:testnet and stellar:pubnet,
# so mirroring the testnet passphrase lets the unmodified upstream scheme run against a local RPC with
# 1-second ledgers. Keys used here are throwaway test keys: nothing signed locally exists on testnet.
name: rail402

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: rail402
      POSTGRES_PASSWORD: rail402
      POSTGRES_DB: rail402
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rail402 -d rail402"]
      interval: 2s
      timeout: 3s
      retries: 30

  stellar:
    profiles: [stellar]
    image: stellar/quickstart:v669-b1438.1-latest
    command: ["--local", "--limits", "testnet", "--enable", "core,rpc"]
    environment:
      NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      RANDOMIZE_NETWORK_PASSPHRASE: "false"
    ports:
      # /rpc (Stellar RPC) and /friendbot
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf -H "Content-Type: application/json"
          -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}'
          http://localhost:8000/rpc | grep -q healthy
      interval: 5s
      timeout: 5s
      retries: 60

  rail402:
    profiles: [service]
    build: .
    image: rail402:local
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://rail402:rail402@postgres:5432/rail402
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 40s

volumes:
  postgres-data:
