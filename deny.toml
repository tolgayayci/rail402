# cargo-deny — the supply-chain gate for the Rust/Soroban side of the deliverable.
#
# The JS/TS tree is gated by scripts/license-gate.mjs (pnpm) + osv-scanner. The two Soroban contracts
# (contracts/upto-stellar, contracts/agent-policy) ship in the deliverable too, and their ~200 crate
# dependencies each were scanned by NEITHER — the policy covers every dependency. This
# closes that gap: `cargo deny --manifest-path contracts/<c>/Cargo.toml --config deny.toml check`.
#
# One shared policy for both contracts, so the Rust allowlist can never quietly diverge from the JS
# one. Verdicts live here (the file IS the record) because docs/licenses.md is generated by the JS
# gate and must not be hand-edited.

[advisories]
# Fail on any RUSTSEC advisory or a yanked crate. This is the vulnerability half (the OSV equivalent).
# Add an id to `ignore` ONLY with a one-line reason, mirroring the JS gate's fail-closed posture.
version = 2
yanked = "deny"
# Two UNMAINTAINED notices (not vulnerabilities) on crates the Soroban SDK / arkworks pull deep in the
# transitive tree, which we do not control and cannot replace. A real vulnerability advisory still
# fails the build — only these two known-benign "no longer maintained" notices are acknowledged.
ignore = [
  "RUSTSEC-2024-0388", # `derivative` unmaintained — via soroban-env-host → arkworks
  "RUSTSEC-2024-0436", # `paste` unmaintained — via soroban-sdk-macros
]

[licenses]
# License allowlist, as SPDX ids. Permissive, OSI-approved, redistribution-safe. A crate whose
# license is not here fails the build (fail-closed) until it is either added or given an `exceptions`
# entry with a recorded reason — the Rust twin of the JS gate's "acknowledged review-class exceptions".
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "Zlib",
  "Unlicense",
  "CC0-1.0",
  "BlueOak-1.0.0",
]
# Per-crate exceptions: a permissive-but-unusual license the JS policy would send to human review.
# Each MUST carry a reason.
exceptions = [
  # unicode-ident is "(MIT OR Apache-2.0) AND Unicode-3.0" — the MIT/Apache half we take, but the
  # Unicode-3.0 half (the Unicode license, covering the bundled Unicode data tables) is AND-ed and so
  # must be allowed too. It is permissive and OSI-recognised; scoped to this one ubiquitous crate
  # rather than allowed tree-wide, which is the Rust twin of the JS gate's acknowledged exceptions.
  { name = "unicode-ident", allow = ["Unicode-3.0"] },
]

[bans]
# Duplicate versions are a warning, not a failure — the Soroban SDK pulls a wide tree and some
# duplication is unavoidable and harmless. What matters for §4 is licence + advisories, above.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Only crates.io. An unknown registry or a git dependency must be surfaced, not silently trusted.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
